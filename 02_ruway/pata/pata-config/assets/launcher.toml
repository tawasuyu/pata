# Ejemplo de la BASE de pata (el marco de fábrica). El modelo de config es de dos
# capas: esta BASE DURA (la envía el paquete a /usr/share/pata/base.toml; si no
# hay archivo, se usa el Config::preset compilado) + un overrides.toml SPARSE del
# usuario (~/.config/pata/overrides.toml) que sólo guarda los valores cambiados y
# se mergea encima. La app NUNCA reescribe esta base: cambiar un valor guarda sólo
# ese valor en overrides.toml, y agregar un diente aquí aparece para todos sin que
# nadie borre nada.
#
# (Compat: un launcher.toml viejo —modelo full— se migra una vez a overrides.toml
# sparse y se aparta a .toml.migrated; no hay que borrarlo a mano.)
#
# Un marco es una lista de superficies (bar | panel | dock). Cada una se ancla
# a un borde (top/bottom/left/right) y reparte widgets en sus slots
# start/center/end. Las barras sólidas reservan su franja; autohide/dock/panel
# flotan. Inspeccioná el resultado con:
#   cargo run -p pata-config --bin pata -- --config este.toml --screen 1920x1080

[general]
timezone = "auto"   # "auto" lo detecta del sistema; o un IANA como "America/Lima"
accent = ""         # color de acento hex "#rrggbb" (vacío = el del tema). Tiñe
                    # medidores, glifos y bordes sin recompilar.

# --- Barra superior: el menú clásico tipo waybar/eww ---
# Embellecimiento (todo opcional):
#   opacity  fondo translúcido 0..1 (1 = opaco)
#   gradient degradé vertical sutil en el fondo (true/false)
#   radius   esquinas redondeadas (px) — combina con `margin` para barra flotante
#   margin   separación del borde de pantalla (px); sólo pincel, no cambia reserva
#   cell     cuantiza el ancho de cada widget a múltiplos de `cell` px (grilla
#            alineada). Un widget pide N celdas con la prop `cells`.
[[surfaces]]
kind = "bar"
anchor = "top"
thickness = 32
gap = 16
padding = 12
opacity = 0.92
gradient = true
cell = 24

[[surfaces.start]]
kind = "start_button"
label = "⊞"
# Sin `exec`, el clic abre el menú nativo de apps (descubiertas de
# ~/.config/tawasuyu/apps/*.toml). Para delegar a un lanzador externo en su lugar,
# fija p. ej. `exec = "wofi --show drun"`.

[[surfaces.start]]
kind = "clock"
format = "%H:%M"
# Click → panel para fijar la fecha/hora del sistema (timedatectl vía pkexec).

[[surfaces.center]]
kind = "workspaces"     # una celda por escritorio virtual; click → salta a él.
# Lee el estado del WM con `mirada-ctl workspaces` y cambia con `mirada-ctl
# workspace N` (idioma swaymsg/hyprctl). Bajo otro compositor sin ese CLI, el
# widget se oculta solo. La activa va en acento; las que tienen ventanas, con
# realce; las vacías, tenues.

[[surfaces.center]]
kind = "window_list"

# El racimo de indicadores a la derecha — orden libre.
[[surfaces.end]]
kind = "mpris"          # controles de reproducción (prev/play-pause/next + título, vía playerctl)

[[surfaces.end]]
kind = "astro"          # posición zodiacal del sol + ciclo lunar (aporte)
moon = true

[[surfaces.end]]
kind = "weather"        # dibujo colorido del cielo + temperatura (wttr.in por curl)
# place = "Lima"        # ciudad fija; vacío = ubicación por IP
# exec = "xdg-open https://wttr.in"   # click → abre el pronóstico

[[surfaces.end]]
kind = "cava"           # visualizador de audio (binario `cava` en modo raw)
bars = 12               # número de barras (4..64)

[[surfaces.end]]
kind = "clipboard"          # preview del texto copiado (vía wl-paste)
# Click → selector de historial. Ejemplo con cliphist + wofi:
exec = "cliphist list | wofi --dmenu | cliphist decode | wl-copy"

[[surfaces.end]]
kind = "volume"        # click → mezclador nativo (sink + corrientes por app); rueda ajusta

[[surfaces.end]]
kind = "brightness"

[[surfaces.end]]
kind = "network"        # applet Wi-Fi/Ethernet: icono de señal + popup de redes (nmcli)

[[surfaces.end]]
kind = "bluetooth"      # applet Bluetooth: switch + dispositivos emparejados (bluetoothctl)

[[surfaces.end]]
kind = "notifications"  # campanita: no-molestar + historial reciente (daemon pata-notify)

[[surfaces.end]]
kind = "tray"

# CPU/RAM ya no van en la barra del default: su lugar es el diente «Sistema» del
# sidebar derecho (monitor de sistema). Los widgets `cpu_meter`/`ram_meter` siguen
# disponibles en el catálogo — agregalos aquí si los quieres también en la barra.

[[surfaces.end]]
kind = "session"       # botón de power: bloquear/suspender/reiniciar/apagar/logout

# --- Panel: tarjetas flotantes estilo conky sobre el escritorio ---
# Un panel no reserva franja: sus tarjetas flotan en (x, y) con tamaño (w, h).
# En layer-shell cada tarjeta es su propia surface en la capa de fondo.
[[surfaces]]
kind = "panel"

[[surfaces.cards]]
x = 40
y = 80
w = 220
h = 110
title = "sistema"

[[surfaces.cards.widgets]]
kind = "cpu_meter"

[[surfaces.cards.widgets]]
kind = "ram_meter"

# --- Sidebar: rail de dientes acoplable con el navegador de Mónadas (Fase 11) ---
# Colapsado es sólo el rail (una franja de `thickness` px pegada al borde); al
# clickear un diente despliega su panel (de `panel_width` px) sobre el escritorio
# con el navegador de las Mónadas de nouser y sus archivos, conmutable
# árbol/grafo. Requiere un daemon nouser vivo (descubierto por el broker o por el
# socket default); sin él, el panel muestra "Conectando con nouser…".
#
# Abrir un archivo (right-click) lo enruta a la app nativa que declare su mime, o
# a `xdg-open` si ninguna lo hace. Para que las apps de la suite lo reciban, copia
# sus manifiestos a ~/.config/tawasuyu/apps/ (hay ejemplos en
# shared/app-bus/assets/apps/: media.toml, nada.toml).
[[surfaces]]
kind = "sidebar"
anchor = "left"
thickness = 44
panel_width = 300

# --- PRIMER grupo del rail: los PERFILES. Su primer diente es `pacha`
# (contextos de usuario): un perfil con SU diente dedicado. Su panel es un
# sidebar de instancias (los contextos definidos en ~/.config/pacha/pachas.ron),
# siempre una activa; al seleccionar una se muestra su contenido y un botón para
# activarla. NO es un chip mezclado en el control center: es su propio diente.
[[surfaces.tabs]]
icon = "pacha"
label = "Contexto"
content = { kind = "pacha" }

[[surfaces.tabs]]
icon = "monads"
label = "Mónadas"
content = { kind = "navigator", source = "nouser" }

# --- Diente vivo: icono multifuncional manejado por el árbitro de atención.
# En reposo muestra su glifo; cuando suena música → visualizador; al variar el
# volumen → barra efímera; con la CPU caliente → su carga; con la batería
# bajando/llena → su estado. (El panel desplegado es el navegador por ahora;
# el control center va en una fase próxima.)
[[surfaces.tabs]]
icon = "control"
label = "Control"
content = { kind = "control" }

# --- Sidebar derecho: control center de SISTEMA + flota ---
# El diente «Sistema» (monitor) muestra CPU (promedio + cores) y RAM, reusando
# los panels del quick-settings. A futuro suma las unidades de sandokan (estado/
# telemetría) y la flota de matilda (hosts/contenedores). panel_width generoso
# porque embebe los panels de CPU/RAM (~320 px).
[[surfaces]]
kind = "sidebar"
anchor = "right"
thickness = 44
panel_width = 340
reserve = true

[[surfaces.tabs]]
icon = "monitor"
label = "Sistema"
content = { kind = "monitor" }

# Unidades del plano de control (sandokan): estado + telemetría de las unidades
# vivas, leídas por arje-bus ($ENTE_BUS_SOCK). Sin plano de control corriendo,
# muestra un aviso.
[[surfaces.tabs]]
icon = "unidades"
label = "Unidades"
content = { kind = "unidades" }

# Flota baremetal (matilda): inventario read-only de hosts/contenedores/vhosts.
# Lee ~/.config/tawasuyu/flota/inventory.json (JSON de matilda-core). Sin él,
# muestra un aviso. SSH/discover/apply son fase posterior.
[[surfaces.tabs]]
icon = "flota"
label = "Flota"
content = { kind = "flota" }

# --- Shell: barra inferior autoescondible con el input de shuma ---
# Al escribir, el frontend despliega el resto de shuma estilo Quake.
[[surfaces]]
kind = "bar"
anchor = "bottom"
thickness = 40
autohide = true

[[surfaces.center]]
kind = "shuma_input"
hotkey = "F12"
placeholder = "› pregunta, lanza, navega"
